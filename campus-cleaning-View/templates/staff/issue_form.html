{% extends "base.html" %}
{% block title %}Report Issue{% endblock %}
{% block content %}
  <div class="page-header"><div><h1>Report a Cleaning Issue</h1></div></div>
  <div class="card" style="padding: 24px; max-width: 480px;">
    <form method="POST" action="{{ url_for('issues.staff_issue_create') }}">
      <div class="form-group">
        <label for="location_id">Location</label>
        <select id="location_id" name="location_id" required>
          <option value="">Select a location…</option>
          {% for l in locations %}
          <option value="{{ l.Location_ID }}">{{ l.Location_ID }} - Block {{ l.Block_Name }}, {{ l.Room_No }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label for="task_id">Related Task (optional)</label>
        <select id="task_id" name="task_id">
          <option value="">— none —</option>
          {% for t in tasks %}
          <option value="{{ t.Task_ID }}">#{{ t.Task_ID }} - {{ t.Location_ID }} ({{ t.Task_Date }})</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label for="issue_type">Issue Type</label>
        <input type="text" id="issue_type" name="issue_type" placeholder="e.g. Water Leakage, Damaged Equipment" required />
      </div>
      <div class="form-group">
        <label for="priority">Priority</label>
        <select id="priority" name="priority" required>
          <option value="Low">Low</option>
          <option value="Medium" selected>Medium</option>
          <option value="High">High</option>
        </select>
      </div>
      <div class="form-group">
        <label for="description">Description</label>
        <textarea id="description" name="description" placeholder="Describe the issue"></textarea>
      </div>
      <div style="display: flex; gap: 10px;">
        <a href="{{ url_for('issues.staff_issue_list') }}" class="btn btn-outline">Cancel</a>
        <button type="submit" class="btn btn-primary">Report Issue</button>
      </div>
    </form>
  </div>
{% endblock %}
